; CodexBar usage panel for Rainmeter (fork-only extra, not part of upstream).
; Shows the desktop app's cached Claude / Codex / Grok quotas, read from its
; PowerToys status pipe. No provider API calls are made from here.
; Styling follows the stock illustro skins; usage.lua positions every meter.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureStatus "Run"]

[Metadata]
Name=CodexBar Usage
Author=Win-CodexBar fork
Information=Claude, Codex and Grok quota windows from the CodexBar desktop app (status pipe).
Version=1.1.0

[Variables]
@Include=#@#Settings.inc
fontName=Trebuchet MS
textSize=8
colorText=255,255,255,205
colorDim=255,255,255,120
colorHot=235,80,60,255

; ---------------------------------------------------------------- measures

; Re-reads the pipe every FetchSeconds (and once at load).
[MeasureTick]
Measure=Calc
Formula=1
UpdateDivider=#FetchSeconds#
OnUpdateAction=[!CommandMeasure MeasureStatus "Run"]

[MeasureStatus]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#read-status.ps1"
State=Hide
OutputType=UTF8
Timeout=10000

[MeasureScript]
Measure=Script
ScriptFile=#@#usage.lua
MaxGroups=3
MaxRows=8

; ------------------------------------------------------------------ styles

[styleText]
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1
H=14

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleIcon]
X=10
W=14
H=14
PreserveAspectRatio=1
AntiAlias=1
Hidden=1

[styleName]
X=30
W=110
FontSize=9
Hidden=1

[styleAge]
StringAlign=Right
X=200
W=60
FontColor=#colorDim#
StringStyle=Normal
Hidden=1

[styleSep]
X=10
Shape=Rectangle 0,0,190,1 | Fill Color 255,255,255,25 | StrokeWidth 0
Hidden=1

[styleRowLabel]
X=30
W=130
InlineSetting=Color | #colorDim#
InlinePattern=\s\s.*$
Hidden=1

[styleRowValue]
StringAlign=Right
X=200
W=40
Hidden=1

[styleRowBar]
X=30
Shape=Rectangle 0,0,170,1 | Fill Color 255,255,255,15 | StrokeWidth 0
Shape2=Rectangle 0,0,0,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Hidden=1

; ------------------------------------------------------------------ meters

[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0.5,0.5,209,74,6 | Fill Color 0,0,0,170 | StrokeWidth 1 | Stroke Color 255,255,255,40

[MeterTitle]
Meter=String
MeterStyle=styleTitle
X=105
Y=12
W=190
H=18
Text=AI Usage

[MeterStatus]
Meter=String
MeterStyle=styleText
X=10
Y=40
W=190
H=30
ClipString=2
Text=Waiting for CodexBar...

; Provider group headers (separator above, icon, name, data age).
[MeterSep1]
Meter=Shape
MeterStyle=styleSep
[MeterIcon1]
Meter=Image
MeterStyle=styleIcon
[MeterName1]
Meter=String
MeterStyle=styleText | styleName
[MeterAge1]
Meter=String
MeterStyle=styleText | styleAge

[MeterSep2]
Meter=Shape
